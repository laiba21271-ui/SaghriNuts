<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="BbTrjLeWql_trUTy-0zMVeamShPCyGu6b1RwMBgmBhY" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saghri Nuts - Cart & Checkout</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" />

    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <div class="cart-container">

        <!-- LEFT DIV: DYNAMIC CART ITEMS -->
        <div class="cart-left">

            <div class="logo-area">
                <h1>Saghri<span>Nuts</span></h1>
            </div>

            <div class="cart-heading">
                <h2>Your Cart</h2>
                <p>Review your items before checkout.</p>
            </div>

            <div id="cartItems"></div>

            <a href="shop.html" class="continue-shopping">
                ← Continue Shopping
            </a>

        </div>

        <!-- RIGHT DIV: SUMMARY & CHECKOUT FORM -->
        <div class="checkout-right">

            <div class="checkout-box">

                <h2>Checkout</h2>

                <!-- ORDER SUMMARY -->
                <div class="order-summary">

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <strong class="subtotal-value">Rs. 0</strong>
                    </div>

                    <div class="summary-row">
                        <span>Shipping</span>
                        <strong class="shipping-value">Rs. 0</strong>
                    </div>

                    <div class="summary-line"></div>

                    <div class="summary-row total">
                        <span>Total</span>
                        <strong class="total-value">Rs. 0</strong>
                    </div>

                </div>

                <!-- DELIVERY INFORMATION -->
                <h3 class="section-title">Delivery Information</h3>

                <form id="checkoutForm">

                    <!-- NAME -->
                    <div class="input-group">
                        <label>Full Name *</label>
                        <input 
                            type="text" 
                            name="name"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <!-- EMAIL -->
                    <div class="input-group">
                        <label>Email Address *</label>
                        <input 
                            type="email" 
                            name="email"
                            id="email"
                            placeholder="Enter your email address"
                            required
                        >
                    </div>

                    <!-- PHONE -->
                    <div class="input-group">
                        <label>Phone Number *</label>
                        <input 
                            type="tel" 
                            name="phone"
                            id="phone"
                            placeholder="+92 300 1234567"
                            required
                        >
                    </div>

                    <!-- COUNTRY -->
                    <div class="input-group">
                        <label>Country / Region *</label>
                        <select name="country" id="country" required>
                            <option value="">Select Country / Region</option>
                            <option value="Pakistan" selected>Pakistan</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Canada">Canada</option>
                            <option value="United Arab Emirates">United Arab Emirates</option>
                            <option value="Saudi Arabia">Saudi Arabia</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- ADDRESS -->
                    <div class="input-group">
                        <label>Street Address *</label>
                        <input 
                            type="text" 
                            name="address"
                            id="address"
                            placeholder="House number, street name, apartment, etc."
                            required
                        >
                    </div>

                    <!-- CITY -->
                    <div class="input-group">
                        <label>City *</label>
                        <input 
                            type="text" 
                            name="city"
                            id="city"
                            placeholder="Enter your city"
                            required
                        >
                    </div>

                    <!-- STATE -->
                    <div class="input-group">
                        <label>State / Province / Region *</label>
                        <input 
                            type="text" 
                            name="state"
                            id="state"
                            placeholder="State, province or region"
                            required
                        >
                    </div>

                    <!-- POSTAL CODE -->
                    <div class="input-group">
                        <label>Postal / ZIP Code</label>
                        <input 
                            type="text" 
                            name="zip"
                            id="zip"
                            placeholder="Enter postal or ZIP code"
                        >
                    </div>

                    <!-- PAYMENT METHOD -->
                    <h3 class="section-title payment-title">Payment Method</h3>

                    <div class="input-group">
                        <label>Select Payment Method *</label>
                        <select 
                            id="paymentMethod" 
                            name="paymentMethod" 
                            required
                            onchange="document.getElementById('bankDetailsBox').style.display = (this.value === 'bank' ? 'block' : 'none');"
                        >
                            <option value="">Select Payment Method</option>
                            <option value="cod">Cash on Delivery (COD)</option>
                            <option value="bank">Bank Transfer / EasyPaisa / JazzCash</option>
                            <option value="card">Credit / Debit Card</option>
                        </select>
                    </div>

                    <!-- BANK DETAILS BOX (Only shows when Bank Transfer is selected) -->
                    <div id="bankDetailsBox" style="display: none; background: #f8f9fa; border: 1px solid #2e7d32; padding: 12px; border-radius: 6px; margin-bottom: 15px;">
                        <p style="margin: 0 0 5px; font-weight: 600; font-size: 0.9rem;">Meezan Bank: <span style="font-weight: 400;">0102-0102030405</span></p>
                        <p style="margin: 0 0 5px; font-weight: 600; font-size: 0.9rem;">EasyPaisa/JazzCash: <span style="font-weight: 400;">0300-1234567</span></p>
                        <p style="margin: 0 0 10px; font-size: 0.85rem; color: #555;">Account Title: SAGHRI NUTS</p>
                        
                        <input 
                            type="text" 
                            name="transactionId" 
                            id="transactionId" 
                            placeholder="Enter Transaction ID / Reference No."
                            style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"
                        >
                    </div>

                    <!-- TERMS -->
                    <label class="terms-option">
                        <input type="checkbox" required>
                        <span>
                            I agree to the <a href="terms.html">Terms & Conditions</a> and <a href="privacy.html">Privacy Policy</a>.
                        </span>
                    </label>

                    <!-- ORDER BUTTON -->
                    <button type="submit" class="checkout-btn">
                        Place Order
                    </button>

                </form>

            </div>

        </div>

    </div>

    <!-- Firebase Standard Libraries (Compat Version for smooth non-module load) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
