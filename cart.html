<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="BbTrjLeWql_trUTy-0zMVeamShPCyGu6b1RwMBgmBhY" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saghri Nuts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="responsive.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="cart-container">

        <!-- LEFT DIV -->
        <div class="cart-left">

            <div class="logo-area">
                <h1>Saghri<span>Nuts</span></h1>
            </div>

            <div class="cart-heading">
                <h2>Your Cart</h2>
                <p>Review your items before checkout.</p>
            </div>

            <!-- Product -->
            <div class="cart-product">

                <div class="product-image">
                    <img src="raw-almond.png" alt="Raw Almonds">
                </div>

                <div class="product-info">
                    <h3>Raw Almonds</h3>
                    <p>Premium Quality Almonds</p>

                    <div class="product-bottom">
                        <div class="quantity">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>

                        <strong>Rs. 1,200</strong>
                    </div>
                </div>

            </div>

            <!-- Another Product -->
            <div class="cart-product">

                <div class="product-image">
                    <img src="raw_peanuts.png" alt="Roasted Walnuts">
                </div>

                <div class="product-info">
                    <h3>Raw Peanuts</h3>
                    <p>Fresh & Crispy peanuts</p>

                    <div class="product-bottom">
                        <div class="quantity">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>

                        <strong>Rs. 1,500</strong>
                    </div>
                </div>

            </div>

            <a href="shop.html" class="continue-shopping">
                ← Continue Shopping
            </a>

        </div>

<!-- RIGHT DIV -->
<div class="checkout-right">

    <div class="checkout-box">

        <h2>Checkout</h2>

        <!-- ORDER SUMMARY -->
        <div class="order-summary">

            <div class="summary-row">
                <span>Subtotal</span>
                <strong class="subtotal-value">Rs. 0</strong>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <strong class="shipping-value">Rs. 0</strong>
            </div>

            <div class="summary-line"></div>

            <div class="summary-row total">
                <span>Total</span>
                <strong class="total-value">Rs. 0</strong>
            </div>

        </div>


        <!-- DELIVERY INFORMATION -->
        <h3 class="section-title">Delivery Information</h3>

        <form>

            <!-- NAME -->
            <div class="input-group">
                <label>Full Name</label>
                <input 
                    type="text" 
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <!-- EMAIL -->
            <div class="input-group">
                <label>Email Address</label>
                <input 
                    type="email" 
                    placeholder="Enter your email address"
                    required
                >
            </div>


            <!-- PHONE -->
            <div class="input-group">
                <label>Phone Number</label>
                <input 
                    type="tel" 
                    placeholder="+92 300 1234567"
                    required
                >
            </div>


            <!-- COUNTRY -->
            <div class="input-group">
                <label>Country / Region</label>

                <select required>
                    <option value="">Select Country / Region</option>

                    <option>Pakistan</option>
                    <option>United States</option>
                    <option>United Kingdom</option>
                    <option>Canada</option>
                    <option>Australia</option>
                    <option>United Arab Emirates</option>
                    <option>Saudi Arabia</option>
                    <option>Qatar</option>
                    <option>Kuwait</option>
                    <option>Oman</option>
                    <option>Bahrain</option>
                    <option>Germany</option>
                    <option>France</option>
                    <option>Italy</option>
                    <option>Spain</option>
                    <option>Netherlands</option>
                    <option>Turkey</option>
                    <option>Malaysia</option>
                    <option>Singapore</option>
                    <option>Other</option>
                </select>
            </div>


            <!-- ADDRESS -->
            <div class="input-group">
                <label>Street Address</label>

                <input 
                    type="text" 
                    placeholder="House number, street name, apartment, etc."
                    required
                >
            </div>


            <!-- CITY -->
            <div class="input-group">
                <label>City</label>

                <input 
                    type="text" 
                    placeholder="Enter your city"
                    required
                >
            </div>


            <!-- STATE -->
            <div class="input-group">
                <label>State / Province / Region</label>

                <input 
                    type="text" 
                    placeholder="State, province or region"
                    required
                >
            </div>


            <!-- POSTAL CODE -->
            <div class="input-group">
                <label>Postal / ZIP Code</label>

                <input 
                    type="text" 
                    placeholder="Enter postal or ZIP code"
                    required
                >
            </div>


           <h3 class="section-title payment-title">
    Payment Method
</h3>

<div class="input-group">
    <label>Select Payment Method</label>

    <select id="paymentMethod" required>
        <option value="">Select Payment Method</option>
        <option value="card">Credit / Debit Card</option>
        <option value="paypal">PayPal</option>
        <option value="applepay">Apple Pay</option>
        <option value="googlepay">Google Pay</option>
        <option value="bank">Bank Transfer</option>
        <option value="cod">Cash on Delivery</option>
    </select>
</div>


            <!-- TERMS -->
            <label class="terms-option">

                <input type="checkbox" required>
                <span>
                      I agree to the 
                    <a href="terms.html">Terms & Conditions</a>
                    and
                    <a href="privacy.html">Privacy Policy</a>.
                </span>

            </label>


            <!-- ORDER BUTTON -->
            <button type="submit" class="checkout-btn">
                Place Order
            </button>

        </form>

    </div>

</div>
    </body>
    </html>
