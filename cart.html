<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saghri Nuts - Cart & Checkout</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" />

    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <div class="cart-container">

        <!-- LEFT DIV: CART ITEMS -->
        <div class="cart-left">
            <div class="logo-area">
                <h1>Saghri<span>Nuts</span></h1>
            </div>

            <div class="cart-heading">
                <h2>Your Cart</h2>
                <p>Review your items before checkout.</p>
            </div>

            <div id="cartItems"></div>

            <a href="shop.html" class="continue-shopping">
                ← Continue Shopping
            </a>
        </div>

        <!-- RIGHT DIV: CHECKOUT -->
        <div class="checkout-right">
            <div class="checkout-box">
                <h2>Checkout</h2>

                <div class="order-summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <strong class="subtotal-value">Rs. 0</strong>
                    </div>

                    <div class="summary-row">
                        <span>Delivery Fee</span>
                        <strong class="shipping-value">Rs. 0</strong>
                    </div>

                    <div class="summary-line"></div>

                    <div class="summary-row total">
                        <span>Total</span>
                        <strong class="total-value">Rs. 0</strong>
                    </div>
                </div>

                <h3 class="section-title">Delivery Information</h3>

                <form id="checkoutForm">
                    <div class="input-group">
                        <label>Full Name *</label>
                        <input type="text" id="fullName" placeholder="Enter your full name" required>
                    </div>

                    <div class="input-group">
                        <label>Email Address *</label>
                        <input type="email" id="email" placeholder="Enter your email address" required>
                    </div>

                    <div class="input-group">
                        <label>Phone Number *</label>
                        <input type="tel" id="phone" placeholder="+92 300 1234567" required>
                    </div>

                    <div class="input-group">
                        <label>Country / Region *</label>
                        <select id="country" required>
                            <option value="Pakistan" selected>Pakistan</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Street Address *</label>
                        <input type="text" id="address" placeholder="House number, street name" required>
                    </div>

                    <div class="input-group">
                        <label>City *</label>
                        <input type="text" id="city" placeholder="Enter city" required>
                    </div>

                    <div class="input-group">
                        <label>State / Province *</label>
                        <input type="text" id="state" placeholder="Enter state" required>
                    </div>

                    <div class="input-group">
                        <label>Postal / ZIP Code</label>
                        <input type="text" id="zip" placeholder="ZIP code">
                    </div>

                    <h3 class="section-title payment-title">Payment Method</h3>

                    <div class="input-group">
                        <label>Select Payment Method *</label>
                        <select id="paymentMethod" required>
                            <option value="cod">Cash on Delivery (COD) - Delivery Fee: Rs. 250</option>
                            <option value="bank">Bank Transfer / EasyPaisa / JazzCash (Advance) - Delivery Fee: Rs. 200</option>
                            <option value="card">Credit / Debit Card</option>
                        </select>
                    </div>

                    <div id="bankDetailsBox" style="display: none; background: #f8f9fa; border: 1px solid #2e7d32; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                        <p style="margin: 0 0 5px; font-weight: 600; color: #2e7d32;">✨ Discounted Delivery Fee Applied: Rs. 200</p>
                        <p style="margin: 0 0 5px;">Meezan Bank: 0102-0102030405</p>
                        <p style="margin: 0 0 5px;">EasyPaisa/JazzCash: 0300-1234567</p>
                        <input type="text" id="transactionId" placeholder="Enter Transaction ID / Reference No." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;">
                    </div>

                    <label class="terms-option">
                        <input type="checkbox" required>
                        <span>I agree to the Terms & Conditions.</span>
                    </label>

                    <button type="submit" class="checkout-btn">Place Order</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
