<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saghri Nuts - Wholesale</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Allura&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Style Sheets -->
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <!-- Header / Logo Section -->
    <div class="logo">SaghriNuts</div>

    <!-- Floating Cart Button -->
    <div id="cart-floating-btn" onclick="openCartModal()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
    </div>

    <!-- Wholesale Peanuts Section -->
    <div class="wholesale_peanuts">
        <p id="categories_heading">Wholesale Peanuts</p>
        <div class="peanuts_pic"></div>
        <div class="description_of_product">
            <p id="product_name"><b>Raw Peanuts</b></p>
            <p>10kg Organic raw peanuts direct from our farm</p>
            <p id="product_price"><b>Rs.5000</b></p>
            <p><i id="icon" class="fa-solid fa-star"></i>(4.8)rating</p>
            <button class="add-2-cart" data-id="wholesale-raw-peanuts" data-name="Raw Peanuts" data-price="5000">Add to Cart</button>
        </div>
    </div>

    <br><hr><br>

    <!-- Wholesale Almonds Section -->
    <div class="wholesale_peanuts">
        <p id="categories_heading">Wholesale Almonds</p>
        <div class="almonds_pic"></div>
        <div class="description_of_product">
            <p id="product_name"><b>Raw Almonds</b></p>
            <p>10kg Organic raw almonds direct from our farm</p>
            <p id="product_price"><b>Rs.5000</b></p>
            <p><i id="icon" class="fa-solid fa-star"></i>(4.8)rating</p>
            <button class="add-2-cart" data-id="wholesale-raw-almonds" data-name="Raw Almonds" data-price="5000">Add to Cart</button>
        </div>
    </div>

    <br><hr><br>

    <!-- Checkout / Cart Modal (Popup) -->
    <div id="order-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCartModal()">&times;</span>
            <h2>Complete Your Order</h2>
            
            <div id="cart-summary">
                <h3>Selected Items:</h3>
                <ul id="cart-items-list"></ul>
                <p><strong>Total Amount: </strong>Rs. <span id="cart-total-price">0</span></p>
            </div>

            <form id="order-form" onsubmit="handleOrderSubmit(event)">
                <div class="form-group">
                    <label for="customerName">Full Name:</label>
                    <input type="text" id="customerName" placeholder="Enter your full name" required />
                </div>

                <div class="form-group">
                    <label for="customerPhone">Phone Number:</label>
                    <input type="tel" id="customerPhone" placeholder="03XXXXXXXXX" required />
                </div>

                <div class="form-group">
                    <label for="customerEmail">Email Address:</label>
                    <input type="email" id="customerEmail" placeholder="example@mail.com" required />
                </div>

                <div class="form-group">
                    <label for="customerAddress">Complete Address:</label>
                    <textarea id="customerAddress" rows="3" placeholder="House no, Street, Sector, City" required></textarea>
                </div>

                <button type="submit" id="submit-order-btn">Place Order Now</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
